[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "reidfm"
version = "0.1.0"
description = "Multi-source (foundation) person ReID fine-tuning on top of FastReID for SHAWAF"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "tabulate>=0.9",
]


[project.optional-dependencies]
# Everything FastReID needs at train/eval time. torch is preinstalled on Kaggle,
# so the lower bounds are loose on purpose (pip will not reinstall it).
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "yacs>=0.1.8",
    "termcolor>=2.0",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "gdown>=5.0",
    "faiss-cpu>=1.8",
    "tensorboard>=2.14",
    "Cython>=3.0",
]
dev = [
    "pytest>=8.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["reidfm*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fastreid: needs the pinned FastReID clone importable",
    "slow: end-to-end training smoke tests",
]
